name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Validate Make IML JSON files
        run: node -e "require('fs').readdirSync('.', { recursive: true }).filter((file) => file.endsWith('.imljson')).forEach((file) => JSON.parse(require('fs').readFileSync(file)))"
